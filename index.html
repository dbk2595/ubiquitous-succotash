<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小川闲置铺 · 二手虚拟商品小摊</title>
<style>
  :root{
    --bg:#faf7f2; --card:#ffffff; --ink:#2a2622; --muted:#8a8278;
    --accent:#c8553d; --accent-2:#f4a261; --line:#ebe4dc; --ok:#3a8f5a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.6;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:0 18px}

  header.top{
    background:linear-gradient(135deg,#3a322c,#5b4a3f);color:#fff;
    padding:26px 0 22px;box-shadow:0 2px 14px rgba(0,0,0,.08);
  }
  header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  header.top h1{font-size:24px;letter-spacing:1px}
  header.top .sub{color:#d8c8b6;font-size:13px;margin-top:4px}
  .top-actions{display:flex;gap:10px}
  .btn{
    border:0;cursor:pointer;border-radius:8px;padding:9px 16px;font-size:14px;
    background:var(--accent);color:#fff;transition:transform .12s,filter .12s;
  }
  .btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
  .btn.ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25)}
  .btn.line{background:#fff;color:var(--accent);border:1px solid var(--line)}
  .btn.sm{padding:6px 11px;font-size:12px}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  .banner{
    background:var(--accent-2);color:#3a2c1c;text-align:center;
    padding:9px;font-size:13px;font-weight:500;
  }

  main{padding:26px 0 40px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s;cursor:pointer;
  }
  .card:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(60,40,20,.1)}
  .card .thumb{height:150px;background:linear-gradient(135deg,#f0e6d6,#e6d4bd);display:flex;align-items:center;justify-content:center;font-size:42px;overflow:hidden;position:relative}
  .card .thumb .img-count{
    position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.55);color:#fff;
    font-size:11px;padding:2px 7px;border-radius:12px;display:flex;align-items:center;gap:3px
  }
  .card .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .card .body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
  .card h3{font-size:16px}
  .card .desc{color:var(--muted);font-size:13px;min-height:38px}
  .card .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:#fdeeda;color:#9c6b1d;width:fit-content}
  .card .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:6px}
  .price{color:var(--accent);font-weight:700;font-size:18px}
  .price small{font-size:12px;font-weight:400;color:var(--muted);margin-left:2px}

  .mask{
    position:fixed;inset:0;background:rgba(30,22,18,.55);display:none;
    align-items:center;justify-content:center;z-index:50;padding:18px;
  }
  .mask.show{display:flex}
  .modal{
    background:#fff;border-radius:14px;max-width:520px;width:100%;
    max-height:90vh;overflow:auto;padding:22px;
  }
  .modal h2{font-size:18px;margin-bottom:6px}
  .modal .close{float:right;cursor:pointer;color:var(--muted);font-size:20px;background:none;border:0}
  .field{margin-top:12px}
  .field label{display:block;font-size:13px;color:#5b5249;margin-bottom:4px}
  .field input,.field textarea,.field select{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;
  }
  .field textarea{min-height:70px;resize:vertical}
  .qty{display:flex;align-items:center;gap:10px}
  .qty button{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;font-size:16px}
  .qty span{min-width:30px;text-align:center;font-weight:600}

  .pay-box{margin-top:14px;border:1px dashed var(--line);border-radius:10px;padding:14px;background:#fbf7f1}
  .pay-tabs{display:flex;gap:8px;margin-bottom:12px}
  .pay-tabs button{flex:1;padding:8px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-size:13px}
  .pay-tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .qr-wrap{display:flex;flex-direction:column;align-items:center;gap:8px}
  .qr-wrap img{width:200px;height:200px;border-radius:8px;background:#eee;object-fit:cover}
  .pay-tip{font-size:12px;color:var(--muted);text-align:center;line-height:1.5}
  .amount{font-size:22px;color:var(--accent);font-weight:700;text-align:center;margin:6px 0}

  .order-item{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:#fff}
  .order-item .oh{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
  .order-item .oi{font-size:14px;margin:3px 0}
  .order-item .actions{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
  .badge{font-size:11px;padding:2px 8px;border-radius:20px;display:inline-block}
  .badge.wait{background:#fdeeda;color:#9c6b1d}
  .badge.reported{background:#ffe8cc;color:#c25e00;font-weight:600}
  .badge.paid{background:#e0f0e6;color:var(--ok)}
  .badge.sent{background:#dde8f5;color:#3a6db5}
  .badge.done{background:#e6e6e6;color:#666}
  .empty{text-align:center;color:var(--muted);padding:30px 0;font-size:14px}
  .qr-preview{width:130px;height:130px;object-fit:cover;margin-top:8px;border-radius:8px;background:#eee;display:block}
  /* 详情弹窗画廊 */
  .gallery{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
  .gallery .stage{width:100%;max-height:340px;background:linear-gradient(135deg,#f0e6d6,#e6d4bd);border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:60px;position:relative}
  .gallery .stage img{width:100%;height:100%;object-fit:cover;display:block}
  .gallery .nav{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;border:0;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
  .gallery .nav.prev{left:8px}.gallery .nav.next{right:8px}
  .gallery .nav:disabled{opacity:.25;cursor:not-allowed}
  .gallery .thumbs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
  .gallery .thumbs button{flex:0 0 auto;width:56px;height:56px;border-radius:8px;overflow:hidden;border:2px solid transparent;background:#eee;cursor:pointer;padding:0}
  .gallery .thumbs button.active{border-color:var(--accent)}
  .gallery .thumbs button img{width:100%;height:100%;object-fit:cover;display:block}
  .detail-info{margin-top:6px}
  .detail-info .desc{color:var(--muted);font-size:14px;margin:8px 0;line-height:1.7}
  .detail-info .meta{display:flex;align-items:center;gap:8px;margin:6px 0}
  .detail-info .price{font-size:22px}
  /* 多图上传预览 */
  .img-up-preview{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .img-up-preview .item{position:relative;width:80px;height:80px;border-radius:8px;overflow:hidden;background:#eee;border:1px solid var(--line)}
  .img-up-preview .item img{width:100%;height:100%;object-fit:cover;display:block}
  .img-up-preview .item .rm{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border:0;cursor:pointer;font-size:13px;line-height:1}
  .admin-goods-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
  .admin-goods-row .g-info{flex:1}
  .admin-goods-row .g-info b{font-size:14px}

  footer{padding:24px 0 30px;text-align:center;color:var(--muted);font-size:12px;border-top:1px solid var(--line);background:#fff}
  footer a{color:var(--accent);text-decoration:none}

  .toast{
    position:fixed;left:50%;bottom:30px;transform:translateX(-50%);
    background:#2a2622;color:#fff;padding:10px 18px;border-radius:8px;
    font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:100;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

  @media(max-width:560px){
    header.top .wrap{flex-direction:column;align-items:flex-start}
    .top-actions{width:100%}
    .top-actions .btn{flex:1}
  }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div>
      <h1>小川闲置铺</h1>
      <div class="sub">数字商品二手小摊 · 自用闲置出 · 即买即发</div>
    </div>
    <div class="top-actions">
      <button class="btn ghost" onclick="openMyOrders()">我的订单</button>
      <button class="btn ghost" onclick="openAdminLogin()">管理员</button>
    </div>
  </div>
</header>

<div class="banner">
  扫码付款后请填写付款人名称便于核实 · 管理员核实后自动显示发货链接 · 虚拟商品售出恕不退换
</div>

<main>
  <div class="wrap">
    <div class="grid" id="goods"></div>
  </div>
</main>

<footer>
  <div class="wrap">
    店铺主人:小川 · 联系邮箱:xiaochuan@example.com · 下单后请扫码付款并填写信息
  </div>
</footer>

<!-- 购买模态框 -->
<div class="mask" id="buyMask">
  <div class="modal">
    <button class="close" onclick="closeMask('buyMask')">×</button>
    <h2 id="buyTitle">购买</h2>
    <div id="buyBody"></div>
  </div>
</div>

<!-- 商品详情模态框 -->
<div class="mask" id="detailMask">
  <div class="modal" style="max-width:560px">
    <button class="close" onclick="closeMask('detailMask')">×</button>
    <div id="detailBody"></div>
  </div>
</div>

<!-- 我的订单模态框 -->
<div class="mask" id="orderMask">
  <div class="modal">
    <button class="close" onclick="closeMask('orderMask')">×</button>
    <h2>我的订单</h2>
    <div id="myOrderList"></div>
  </div>
</div>

<!-- 管理员登录模态框 -->
<div class="mask" id="adminLoginMask">
  <div class="modal">
    <button class="close" onclick="closeMask('adminLoginMask')">×</button>
    <h2>管理员登录</h2>
    <div class="field">
      <label>管理员密码</label>
      <input id="adminPwd" type="password" placeholder="请输入密码" onkeydown="if(event.key==='Enter')doAdminLogin()">
    </div>
    <button class="btn" style="width:100%;margin-top:14px" onclick="doAdminLogin()">登录</button>
  </div>
</div>

<!-- 管理员面板模态框 -->
<div class="mask" id="adminMask">
  <div class="modal" style="max-width:640px">
    <button class="close" onclick="closeMask('adminMask')">×</button>
    <h2>管理后台</h2>

    <h3 style="font-size:15px;margin:14px 0 6px;color:#5b5249">① 上传收款二维码</h3>
    <div class="pay-box">
      <div style="display:flex;gap:14px;flex-wrap:wrap">
        <div style="flex:1;min-width:200px">
          <label style="font-size:13px;display:block;margin-bottom:6px">支付宝收款码</label>
          <input type="file" accept="image/*" onchange="uploadQR('alipay',event)">
          <img id="qr-alipay-preview" class="qr-preview" alt="">
        </div>
        <div style="flex:1;min-width:200px">
          <label style="font-size:13px;display:block;margin-bottom:6px">微信收款码</label>
          <input type="file" accept="image/*" onchange="uploadQR('wechat',event)">
          <img id="qr-wechat-preview" class="qr-preview" alt="">
        </div>
      </div>
      <div class="pay-tip" style="margin-top:8px">图片存于服务器,上传后全网访客可见</div>
    </div>

    <h3 style="font-size:15px;margin:18px 0 6px;color:#5b5249">② 新增商品</h3>
    <div class="field"><label>商品名称</label><input id="newName" placeholder="如 Notion 模板"></div>
    <div class="field"><label>描述</label><textarea id="newDesc" placeholder="一句话介绍"></textarea></div>
    <div style="display:flex;gap:10px">
      <div class="field" style="flex:1"><label>价格(元)</label><input id="newPrice" type="number" step="0.1" placeholder="9.9"></div>
      <div class="field" style="flex:1"><label>分类标签</label><input id="newTag" placeholder="数字模板"></div>
    </div>
    <div class="field">
      <label>商品截图(可选,可多选,显示在商品详情画廊)</label>
      <input type="file" id="newImage" accept="image/*" multiple onchange="previewNewImages(event)">
      <div id="newImagePreview" class="img-up-preview"></div>
      <div class="pay-tip" style="margin-top:6px">支持选择多张图,单张 &lt;2MB;第一张作为商品卡片封面</div>
    </div>
    <div class="field"><label>发货链接(付款后展示给买家)</label><input id="newUrl" type="url" placeholder="https://网盘链接/教程地址等,可留空"></div>
    <button class="btn" style="width:100%;margin-top:8px" onclick="addGoods()">添加商品</button>

    <h3 style="font-size:15px;margin:18px 0 6px;color:#5b5249">③ 商品列表</h3>
    <div id="adminGoodsList"></div>

    <h3 style="font-size:15px;margin:18px 0 6px;color:#5b5249">④ 订单管理</h3>
    <div id="adminOrderList"></div>

    <button class="btn line" style="width:100%;margin-top:14px" onclick="resetData()">恢复默认商品</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ API 封装 ============ */
const API={
  goods:'/api/goods',
  qr:'/api/qr',
  orders:'/api/orders'
};
async function apiGet(url,withAuth){
  const headers={};
  if(withAuth) headers['X-Admin-Pwd']=localStorage.getItem('xc_admin_pwd')||'';
  const r=await fetch(url,{headers});
  if(!r.ok) throw new Error('GET '+url+' '+r.status);
  return r.json();
}
async function apiPost(url,body,withAuth){
  const headers={'Content-Type':'application/json'};
  if(withAuth) headers['X-Admin-Pwd']=localStorage.getItem('xc_admin_pwd')||'';
  const r=await fetch(url,{method:'POST',headers,body:JSON.stringify(body||{})});
  const txt=await r.text();
  let data; try{ data=txt?JSON.parse(txt):{}; }catch(e){ data={}; }
  if(!r.ok) throw new Error(data.error||('POST '+url+' '+r.status));
  return data;
}
async function apiDel(url,withAuth){
  const headers={};
  if(withAuth) headers['X-Admin-Pwd']=localStorage.getItem('xc_admin_pwd')||'';
  const r=await fetch(url,{method:'DELETE',headers});
  if(!r.ok) throw new Error('DELETE '+url+' '+r.status);
  return r.json();
}

/* ============ 商品 ============ */
let goodsList=[];
async function loadGoods(){
  goodsList=await apiGet(API.goods);
}
function renderGoods(){
  const box=document.getElementById('goods');
  if(!goodsList.length){ box.innerHTML='<div class="empty">暂无商品,管理员可去后台添加</div>'; return; }
  box.innerHTML=goodsList.map(g=>{
    const imgs=g.images||(g.image?[g.image]:[]);
    const cover=imgs[0];
    const cnt=imgs.length;
    return `
    <div class="card" onclick="openDetail(${g.id})">
      <div class="thumb">
        ${cover?`<img src="${cover}" alt="${escapeHtml(g.name)}">`:(g.emoji||'📦')}
        ${cnt>1?`<span class="img-count">🖼 ${cnt}</span>`:''}
      </div>
      <div class="body">
        <h3>${g.name}</h3>
        <div class="desc">${g.desc}</div>
        <span class="tag">${g.tag}</span>
        <div class="foot">
          <div class="price">¥${Number(g.price).toFixed(2)}<small>起</small></div>
          <button class="btn sm" onclick="event.stopPropagation();openBuy(${g.id})">立即购买</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

/* ============ 购买流程 ============ */
let curGoods=null, curQty=1, curPay='alipay', qrCache={};

/* ============ 商品详情 ============ */
let detailGoods=null, detailImgs=[], detailIdx=0;
function openDetail(id){
  const g=goodsList.find(x=>x.id===id);
  if(!g) return;
  detailGoods=g;
  detailImgs=g.images||(g.image?[g.image]:[]);
  detailIdx=0;
  renderDetail();
  showMask('detailMask');
}
function renderDetail(){
  const g=detailGoods;
  const n=detailImgs.length;
  const cur=detailImgs[detailIdx];
  const stageHtml=cur
    ? `<img src="${cur}" alt="${escapeHtml(g.name)}">`
    : `<div style="font-size:60px">${g.emoji||'📦'}</div>`;
  const navHtml=n>1?`
    <button class="nav prev" onclick="chgDetailImg(-1)" ${detailIdx===0?'disabled':''}>‹</button>
    <button class="nav next" onclick="chgDetailImg(1)" ${detailIdx===n-1?'disabled':''}>›</button>`
    : '';
  const thumbsHtml=n>1?`
    <div class="thumbs">
      ${detailImgs.map((src,i)=>`<button class="${i===detailIdx?'active':''}" onclick="setDetailImg(${i})"><img src="${src}" alt=""></button>`).join('')}
    </div>`:'';
  document.getElementById('detailBody').innerHTML=`
    <h2 style="margin-bottom:4px">${escapeHtml(g.name)}</h2>
    <div class="gallery">
      <div class="stage">${stageHtml}${navHtml}</div>
      ${thumbsHtml}
    </div>
    <div class="detail-info">
      <div class="meta">
        <span class="tag">${g.tag}</span>
        <div class="price">¥${Number(g.price).toFixed(2)}<small>起</small></div>
      </div>
      <div class="desc">${escapeHtml(g.desc)}</div>
      <button class="btn" style="width:100%;margin-top:10px" onclick="closeMask('detailMask');openBuy(${g.id})">立即购买</button>
    </div>
  `;
}
function chgDetailImg(d){
  const n=detailImgs.length; if(!n) return;
  detailIdx=(detailIdx+d+n)%n;
  renderDetail();
}
function setDetailImg(i){ detailIdx=i; renderDetail(); }

function openBuy(id){
  curGoods=goodsList.find(g=>g.id===id);
  if(!curGoods) return;
  curQty=1; curPay='alipay';
  renderBuy();
  showMask('buyMask');
}
function renderBuy(){
  const g=curGoods;
  document.getElementById('buyTitle').textContent='购买 · '+g.name;
  document.getElementById('buyBody').innerHTML=`
    <div class="field qty">
      <label>数量</label>
      <button onclick="chgQty(-1)">-</button>
      <span id="qtyNum">${curQty}</span>
      <button onclick="chgQty(1)">+</button>
    </div>
    <div class="amount">合计:¥<span id="total">${(g.price*curQty).toFixed(2)}</span></div>

    <div class="pay-box">
      <div class="pay-tabs">
        <button class="${curPay==='alipay'?'active':''}" onclick="setPay('alipay')">支付宝</button>
        <button class="${curPay==='wechat'?'active':''}" onclick="setPay('wechat')">微信</button>
      </div>
      <div class="qr-wrap">
        <img id="qrImg" src="${getQrSrc(curPay)}"
             onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22><rect width=%22200%22 height=%22200%22 fill=%22%23eee%22/><text x=%22100%22 y=%22110%22 font-size=%2214%22 text-anchor=%22middle%22 fill=%22%23888%22>管理员尚未上传${curPay==='alipay'?'支付宝':'微信'}收款码</text></svg>';"
             alt="${curPay==='alipay'?'支付宝':'微信'}收款码">
        <div class="pay-tip">请扫码支付 <b>¥${(g.price*curQty).toFixed(2)}</b><br>付款后填写下方信息提交,我会在 12 小时内发货</div>
      </div>
    </div>

    <div class="field">
      <label>联系方式 / 备注(可选,如微信号便于发货)</label>
      <textarea id="remark" placeholder="如需发货到指定渠道,请在此留下联系方式"></textarea>
    </div>
    <button class="btn" style="width:100%;margin-top:14px" onclick="submitOrder()">提交订单</button>
  `;
}
function chgQty(d){
  curQty=Math.max(1,curQty+d);
  document.getElementById('qtyNum').textContent=curQty;
  document.getElementById('total').textContent=(curGoods.price*curQty).toFixed(2);
}
function setPay(p){ curPay=p; document.getElementById('qrImg').src=getQrSrc(p); }

function getQrSrc(type){
  if(qrCache[type]) return qrCache[type];
  return 'images/qrcode-'+type+'.jpg';
}
async function loadQRs(){
  try{ qrCache=await apiGet(API.qr)||{}; }
  catch(e){ qrCache={}; }
}

/* ============ 提交订单 ============ */
async function submitOrder(){
  const remark=document.getElementById('remark').value.trim();
  try{
    const o=await apiPost(API.orders,{
      goodsId:curGoods.id, qty:curQty, remark,
      pay:curPay==='alipay'?'支付宝':'微信'
    },false);
    // 订单号存本机 localStorage(访客"我的订单"凭此查)
    saveMyOrderId(o.id);
    // 弹窗不关,改显示订单号 + 填写付款名称,提交后等管理员核实
    renderBuyReport(o.id);
    toast('订单已提交,请扫码付款后填写付款人名称,管理员核实后发货');
  }catch(e){ toast('提交失败:'+e.message); }
}

// 下单成功后弹窗切到"填写付款名称"视图
function renderBuyReport(orderId){
  document.getElementById('buyTitle').textContent='订单已提交';
  document.getElementById('buyBody').innerHTML=`
    <div class="pay-box" style="text-align:center">
      <div style="font-size:13px;color:var(--muted)">订单号(请记下,可在"我的订单"查询)</div>
      <div style="font-size:24px;font-weight:700;color:var(--accent);margin:6px 0;letter-spacing:1px">${orderId}</div>
      <div class="pay-tip">请扫码支付 <b>¥${(curGoods.price*curQty).toFixed(2)}</b>(${curPay==='alipay'?'支付宝':'微信'})<br>付款后填写付款人名称提交,管理员核实到账后即显示发货链接</div>
    </div>
    <div class="field">
      <label>付款人名称 / 转账单号(必填,便于我核实到账)</label>
      <input id="payerName" placeholder="如转账时留的姓名/昵称,或转账单号后几位">
    </div>
    <button class="btn" style="width:100%;margin-top:14px" onclick="reportPaid('${orderId}')">我已付款 · 提交</button>
    <button class="btn line" style="width:100%;margin-top:8px" onclick="closeMask('buyMask')">稍后再填</button>
  `;
}

// 提交付款名称 → 调 report 接口 → 订单进"待核实",等管理员对账确认
async function reportPaid(orderId){
  const payer=(document.getElementById('payerName')&&document.getElementById('payerName').value.trim())||'';
  if(!payer){ toast('请填写付款人名称或转账单号'); return; }
  try{
    await apiPost(API.orders+'/'+orderId+'/report',{payer},false);
    document.getElementById('buyTitle').textContent='已提交 · 等待核实';
    document.getElementById('buyBody').innerHTML=`
      <div class="pay-box" style="text-align:center;background:#fdf6e8;border-color:#f0dfb8">
        <div style="font-size:30px">⏳</div>
        <div style="font-size:15px;font-weight:600;margin:6px 0">付款信息已提交,等待管理员核实</div>
        <div class="pay-tip">核实通过后,发货链接会自动出现在"我的订单"里<br>订单号:<b style="color:var(--accent)">${orderId}</b></div>
      </div>
      <button class="btn line" style="width:100%;margin-top:10px" onclick="closeMask('buyMask')">完成</button>
    `;
    toast('已提交,等待管理员核实');
  }catch(e){ toast('提交失败:'+(e.message||'')); }
}

/* ============ 访客"我的订单" ============ */
function saveMyOrderId(id){
  let arr=JSON.parse(localStorage.getItem('xc_my_orders')||'[]');
  if(!arr.includes(id)){ arr.unshift(id); localStorage.setItem('xc_my_orders',JSON.stringify(arr)); }
}
function getMyOrderIds(){ return JSON.parse(localStorage.getItem('xc_my_orders')||'[]'); }

async function openMyOrders(){
  showMask('orderMask');
  await renderMyOrders();
}
async function renderMyOrders(){
  const box=document.getElementById('myOrderList');
  const ids=getMyOrderIds();
  if(!ids.length){ box.innerHTML='<div class="empty">暂无订单</div>'; return; }
  box.innerHTML='<div class="empty">加载中...</div>';
  try{
    const arr=await apiGet(API.orders+'/by-ids?ids='+encodeURIComponent(ids.join(',')));
    if(!arr.length){ box.innerHTML='<div class="empty">订单已被管理员删除</div>'; return; }
    box.innerHTML=arr.map(o=>{
      const s=STATUS[o.status]||STATUS.wait;
      let acts='';
      if(o.status==='wait') acts=`<button class="btn sm" onclick="reportFromList('${o.id}')">我已付款 · 填付款名称</button>`;
      if(o.status==='reported') acts=`<span style="font-size:12px;color:#9c6b1d">⏳ 付款信息已提交,等待管理员核实</span>`;
      let linkHtml='';
      if(['paid','sent','done'].includes(o.status) && o.deliveryUrl){
        linkHtml=`<div class="oi" style="background:#f0f7e9;padding:8px;border-radius:6px;margin-top:6px">
          <b>📦 发货链接:</b><br>
          <a href="${o.deliveryUrl}" target="_blank" style="color:var(--accent);word-break:break-all">${escapeHtml(o.deliveryUrl)}</a>
          <br><button class="btn sm line" style="margin-top:6px" onclick="copyText('${escapeAttr(o.deliveryUrl)}')">复制链接</button>
        </div>`;
      }
      let payerHtml='';
      if(o.payer){
        payerHtml=`<div class="oi">付款人名称/单号:<b>${escapeHtml(o.payer)}</b></div>`;
      }
      return `
        <div class="order-item">
          <div class="oh"><span>#${o.id}</span><span class="badge ${s.c}">${s.t}</span></div>
          <div class="oh"><span>${o.time||''}</span></div>
          <div class="oi"><b>${o.goods||''}</b> ×${o.qty||1} · ¥${Number(o.total).toFixed(2)} · ${o.pay||''}</div>
          ${o.remark?`<div class="oi">备注:${escapeHtml(o.remark)}</div>`:''}
          ${payerHtml}
          ${linkHtml}
          <div class="actions">${acts}</div>
        </div>
      `;
    }).join('');
  }catch(e){ box.innerHTML='<div class="empty">加载失败</div>'; }
}

// 从"我的订单"列表点"我已付款"(弹出输入框填付款名称)
function reportFromList(id){
  const payer=prompt('请输入付款人名称或转账单号(支付宝/微信账单里显示的):');
  if(payer===null) return;             // 取消
  const v=payer.trim();
  if(!v){ toast('请填写付款人名称或转账单号'); return; }
  apiPost(API.orders+'/'+id+'/report',{payer:v},false)
    .then(()=>{ toast('已提交,等待管理员核实'); renderMyOrders(); })
    .catch(e=>toast('提交失败:'+(e.message||'')));
}

/* ============ 订单状态(管理员+访客共用) ============ */
const STATUS={
  wait:{t:'待付款',c:'wait'},
  reported:{t:'待核实',c:'reported'},
  paid:{t:'已核实',c:'paid'},
  sent:{t:'已发货',c:'sent'},
  done:{t:'已完成',c:'done'}
};

/* ============ 管理员 ============ */
function openAdminLogin(){
  document.getElementById('adminPwd').value='';
  showMask('adminLoginMask');
  setTimeout(()=>document.getElementById('adminPwd').focus(),100);
}
function doAdminLogin(){
  const v=document.getElementById('adminPwd').value;
  // 密码仅前端入口用,真实校验靠后端 X-Admin-Pwd 头
  localStorage.setItem('xc_admin_pwd',v);
  // 带鉴权探测一次,密码错会 401
  verifyAdmin(v);
}
async function verifyAdmin(pwd){
  try{
    const r=await fetch(API.orders,{headers:{'X-Admin-Pwd':pwd}});
    if(r.status===401){ toast('密码错误'); localStorage.removeItem('xc_admin_pwd'); return; }
    if(!r.ok){ toast('登录异常 '+r.status); return; }
    closeMask('adminLoginMask');
    await loadAdminPanel();
    showMask('adminMask');
  }catch(e){ toast('网络错误'); }
}

async function loadAdminPanel(){
  await Promise.all([renderAdminQRPreview(),renderAdminGoods(),renderAdminOrders()]);
}

/* 上传二维码 */
function uploadQR(type,e){
  const file=e.target.files[0];
  if(!file) return;
  if(file.size>2*1024*1024){ toast('图片需小于 2MB'); return; }
  const r=new FileReader();
  r.onload=async()=>{
    try{
      await apiPost(API.qr,{type,data:r.result},true);
      qrCache[type]=r.result;
      document.getElementById('qr-'+type+'-preview').src=r.result;
      toast(type==='alipay'?'支付宝收款码已更新':'微信收款码已更新');
    }catch(err){ toast('上传失败:'+(err.message||'')); }
  };
  r.readAsDataURL(file);
}
async function renderAdminQRPreview(){
  if(!qrCache||!Object.keys(qrCache).length) await loadQRs();
  ['alipay','wechat'].forEach(t=>{
    const img=document.getElementById('qr-'+t+'-preview');
    if(qrCache[t]) img.src=qrCache[t]; else img.removeAttribute('src');
  });
}

/* 新增商品 */
let newImageList=[]; // 多图 base64 缓存
// 多图选择:逐张读为 base64,累积到 newImageList(限 8 张,单张 ≤2MB)
function previewNewImages(e){
  const files=Array.from(e.target.files||[]);
  if(!files.length) return;
  if(newImageList.length+files.length>8){ toast('最多 8 张截图'); return; }
  files.forEach(f=>{
    if(!f.type.startsWith('image/')) return;
    if(f.size>2*1024*1024){ toast('单张需小于 2MB:'+f.name); return; }
    const r=new FileReader();
    r.onload=()=>{ newImageList.push(r.result); renderNewImagePreview(); };
    r.readAsDataURL(f);
  });
  e.target.value='';
}
function renderNewImagePreview(){
  const box=document.getElementById('newImagePreview');
  if(!newImageList.length){ box.innerHTML=''; return; }
  box.innerHTML=newImageList.map((src,i)=>`
    <div class="item">
      <img src="${src}" alt="">
      <button class="rm" onclick="rmNewImage(${i})">×</button>
    </div>`).join('');
}
function rmNewImage(i){ newImageList.splice(i,1); renderNewImagePreview(); }
async function addGoods(){
  const name=document.getElementById('newName').value.trim();
  const desc=document.getElementById('newDesc').value.trim();
  const price=parseFloat(document.getElementById('newPrice').value);
  const tag=document.getElementById('newTag').value.trim()||'其他';
  const deliveryUrl=document.getElementById('newUrl').value.trim();
  if(!name){ toast('请填商品名称'); return; }
  if(!desc){ toast('请填商品描述'); return; }
  if(!(price>=0)){ toast('请填正确价格'); return; }
  const images=newImageList.slice();
  try{
    await apiPost(API.goods,{name,desc,price,tag,deliveryUrl,images},true);
    document.getElementById('newName').value='';
    document.getElementById('newDesc').value='';
    document.getElementById('newPrice').value='';
    document.getElementById('newTag').value='';
    document.getElementById('newUrl').value='';
    newImageList=[]; renderNewImagePreview();
    await loadGoods();
    renderGoods();
    renderAdminGoods();
    toast('商品已添加');
  }catch(e){ toast('添加失败:'+e.message); }
}

async function renderAdminGoods(){
  const box=document.getElementById('adminGoodsList');
  if(!goodsList.length) await loadGoods();
  if(!goodsList.length){ box.innerHTML='<div class="empty">暂无商品</div>'; return; }
  box.innerHTML=goodsList.map(g=>`
    <div class="admin-goods-row">
      <div class="g-info"><b>${g.emoji||'📦'} ${g.name}</b><br><span style="color:var(--muted)">${g.tag} · ¥${Number(g.price).toFixed(2)}</span></div>
      <button class="btn sm line" onclick="delGoods(${g.id})">删除</button>
    </div>
  `).join('');
}
async function delGoods(id){
  if(!confirm('删除该商品?')) return;
  try{
    await apiDel(API.goods+'/'+id,true);
    await loadGoods();
    renderGoods();
    renderAdminGoods();
    toast('已删除');
  }catch(e){ toast('删除失败'); }
}
async function resetData(){
  if(!confirm('恢复为默认商品列表?当前自定义商品将丢失')) return;
  try{
    await apiPost(API.goods+'/reset',{},true);
    await loadGoods();
    renderGoods();
    renderAdminGoods();
    toast('已恢复默认商品');
  }catch(e){ toast('操作失败'); }
}

/* 管理员订单 */
async function renderAdminOrders(){
  const box=document.getElementById('adminOrderList');
  box.innerHTML='<div class="empty">加载中...</div>';
  try{
    const arr=await apiGet(API.orders,true);
    if(!arr.length){ box.innerHTML='<div class="empty">暂无订单</div>'; return; }
    box.innerHTML=arr.map(o=>{
      const s=STATUS[o.status]||STATUS.wait;
      let acts='';
      if(o.status==='wait') acts=`<span style="font-size:12px;color:var(--muted)">等待买家填写付款名称</span>`;
      if(o.status==='reported') acts=`<button class="btn sm" onclick="setOrderStatus('${o.id}','paid')">✓ 标记已付款(核实通过)</button>`;
      if(o.status==='paid') acts=`<button class="btn sm line" onclick="setOrderStatus('${o.id}','sent')">标记已发货</button>`;
      if(o.status==='sent') acts=`<button class="btn sm line" onclick="setOrderStatus('${o.id}','done')">标记已完成</button>`;
      // 已核实(paid/sent/done)显示发货链接
      let linkHtml='';
      if(['paid','sent','done'].includes(o.status) && o.deliveryUrl){
        linkHtml=`<div class="oi" style="background:#f0f7e9;padding:8px;border-radius:6px;margin-top:6px">
          <b>📦 发货链接:</b><br>
          <a href="${o.deliveryUrl}" target="_blank" style="color:var(--accent);word-break:break-all">${escapeHtml(o.deliveryUrl)}</a>
          <br><button class="btn sm line" style="margin-top:6px" onclick="copyText('${escapeAttr(o.deliveryUrl)}')">复制链接</button>
        </div>`;
      }
      // 有付款名称就显示(待核实时重点核对)
      let payerHtml='';
      if(o.payer){
        payerHtml=`<div class="oi">付款人名称/单号:<b style="color:#c25e00">${escapeHtml(o.payer)}</b></div>`;
      }
      return `
        <div class="order-item" ${o.status==='reported'?'style="border-color:#f0b27a;background:#fffaf2"':''}>
          <div class="oh"><span>#${o.id}</span><span class="badge ${s.c}">${s.t}</span></div>
          <div class="oh"><span>${o.time||''}</span></div>
          <div class="oi"><b>${o.goods||''}</b> ×${o.qty||1} · ¥${Number(o.total).toFixed(2)} · ${o.pay||''}</div>
          ${o.remark?`<div class="oi">联系方式/备注:${escapeHtml(o.remark)}</div>`:''}
          ${payerHtml}
          ${linkHtml}
          <div class="actions">${acts}<button class="btn sm line" onclick="delOrder('${o.id}')">删除</button></div>
        </div>
      `;
    }).join('');
  }catch(e){ box.innerHTML='<div class="empty">加载失败</div>'; }
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// JS 字符串转义(用于 onclick 内联调用参数,转义单引号和反斜杠)
function escapeAttr(s){ return String(s==null?'':s).replace(/[\\']/g,c=>'\\'+c); }
function copyText(t){
  if(navigator.clipboard){ navigator.clipboard.writeText(t).then(()=>toast('链接已复制')); }
  else{
    const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast('链接已复制'); }catch(e){ toast('复制失败,请手动选'); }
    document.body.removeChild(ta);
  }
}
async function setOrderStatus(id,s){
  try{
    await apiPost(API.orders+'/'+id+'/status',{status:s},true);
    await renderAdminOrders();
    toast('已更新订单状态');
  }catch(e){ toast('更新失败'); }
}
async function delOrder(id){
  if(!confirm('删除该订单?')) return;
  try{
    await apiDel(API.orders+'/'+id,true);
    await renderAdminOrders();
    toast('已删除');
  }catch(e){ toast('删除失败'); }
}

/* ============ 工具 ============ */
function showMask(id){ document.getElementById(id).classList.add('show'); }
function closeMask(id){ document.getElementById(id).classList.remove('show'); }
document.querySelectorAll('.mask').forEach(m=>{
  m.addEventListener('click',e=>{ if(e.target===m) m.classList.remove('show'); });
});
let toastTimer;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2600);
}

/* ============ 初始化 ============ */
(async function init(){
  try{
    await Promise.all([loadGoods(),loadQRs()]);
    renderGoods();
  }catch(e){
    document.getElementById('goods').innerHTML='<div class="empty">加载失败,请确认服务端已启动</div>';
  }
})();
</script>
</body>
